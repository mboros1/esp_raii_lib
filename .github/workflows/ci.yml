name: CI

on:
  push:
    branches: [ trunk ]
  pull_request:
    branches: [ trunk ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        idf_version: ["v5.1", "v5.2", "latest"]
        target: ["esp32", "esp32c3"]
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build with ESP-IDF
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: ${{ matrix.idf_version }}
        target: ${{ matrix.target }}
        path: test_app

    - name: Test with Wokwi
      if: matrix.target == 'esp32'  # Wokwi works best with ESP32
      uses: wokwi/wokwi-ci-action@v1
      with:
        token: ${{ secrets.WOKWI_CLI_TOKEN }}
        path: test_app
        timeout: 120000  # 2 minutes in milliseconds
        expect_text: "TESTS_COMPLETED: PASS"
        fail_text: "TESTS_COMPLETED: FAIL"

  build-examples:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example: ["basic_gpio", "timer_example"]
        target: ["esp32", "esp32c3", "esp32s3"]
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build example
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: latest
        target: ${{ matrix.target }}
        path: examples/${{ matrix.example }}

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    
    - name: Install cpplint
      run: pip install cpplint
    
    - name: Run cpplint
      run: |
        cpplint --recursive \
          --exclude=test_app/build \
          --exclude=examples/*/build \
          --exclude=deps \
          --filter=-build/header_guard,-readability/casting,-build/include_subdir \
          include/ test_app/main/ examples/
